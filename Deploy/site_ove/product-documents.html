<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Appliance & Fixture Documents | Oak Valley Estates</title><style>
body{margin:0;background:#f2f5f7;color:#192e3a;font:16px/1.5 system-ui,sans-serif}header,main{max-width:1120px;margin:auto;padding:24px}header{padding-bottom:8px}h1{font-size:30px;margin:14px 0 6px}a{color:#086978}input{padding:12px;border:1px solid #a6b8c2;border-radius:6px;width:min(90%,520px);font:inherit}section{background:white;margin:18px 0;padding:20px;border-radius:10px;border:1px solid #d8e2e7}h2{margin:0 0 12px;font-size:21px}article{display:grid;grid-template-columns:minmax(230px,1fr) minmax(300px,1.4fr);gap:18px;padding:16px 0;border-top:1px solid #e1e7ea}.meta{font-size:13px;color:#586b75}.note{color:#825010}.ove-product-documents{margin:0!important}a:focus,input:focus{outline:3px solid #08a0b5;outline-offset:3px}@media(max-width:650px){article{display:block}header,main{padding:16px}}@media print{input,nav{display:none}article{break-inside:avoid}}
</style><script src="product-documents.js?v=20260916"></script></head><body><header><nav><a href="selections.html">Back to selections</a> &nbsp; / &nbsp; <a href="index.html">Project home</a></nav><h1>Appliance & fixture documents</h1><p>Owner manuals, installation guides and specifications for the current selections.</p><label for="search">Find a room, product or model</label><br><input id="search" type="search" placeholder="For example: freezer, T38P, ADU"><p id="status" class="meta" role="status">Loading current selections...</p></header><main id="list"></main><script>
const escapeHtml=s=>String(s||'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
let rooms=[];
const relevant=i=>!/^Deleted\b/i.test(i.name||'') && (oveDocumentRecord(i)||/refrigerator|freezer|dishwasher|microwave|oven|cooktop|invisacook|\brange\b|\bhood\b|blower|washer|dryer|washtower|sink|faucet|toilet|shower|\btub\b|drain|hose bibb|tankless|fireplace|water softener|filtration/i.test(i.name||''));
function render(){let q=document.querySelector('#search').value.toLowerCase(),total=0,linked=0,sections=[];for(const r of rooms){let cards=[];for(const i of r.items||[]){if(!relevant(i))continue;total++;const d=oveDocumentRecord(i);if(d&&d.links.length)linked++;if(q&&!`${r.name} ${i.name} ${i.model}`.toLowerCase().includes(q))continue;cards.push('<article><div><strong>'+escapeHtml(i.name)+'</strong><div class="meta">'+escapeHtml(i.model||'Model not recorded')+'</div></div><div>'+ (d?oveDocumentLinks(i):'<p class="note">'+(i.model?'Manufacturer documentation not yet matched.':'Select or confirm the model to match its manuals and specifications.')+'</p>')+'</div></article>');}if(cards.length)sections.push('<section><h2>'+escapeHtml(r.name)+'</h2>'+cards.join('')+'</section>');}document.querySelector('#list').innerHTML=sections.join('')||'<p>No matching products.</p>';document.querySelector('#status').textContent=`${linked} of ${total} appliance and fixture selections have document links. Items needing a model or document are marked below. Links researched September 16, 2026.`;}
document.querySelector('#search').addEventListener('input',render);
fetch('https://ove-selections.racinc19.workers.dev/selections?_='+Date.now(),{cache:'no-store'}).then(r=>{if(!r.ok)throw Error(r.status);return r.json()}).then(x=>{if(!Array.isArray(x.data))throw Error('Invalid selections');rooms=x.data;render()}).catch(()=>{document.querySelector('#status').textContent='Current selections could not load. Please return to selections and try again.';});
</script></body></html>
