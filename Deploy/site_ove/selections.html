// ── IndexedDB for photos ──────────────────────────────────────────────────
let photoDB=null;
function openPhotoDB(){
  return new Promise((res,rej)=>{
    if(photoDB)return res(photoDB);
    const req=indexedDB.open('sel_photos',2);
    req.onupgradeneeded=e=>{
      const db=e.target.result;
      if(db.objectStoreNames.contains('photos'))db.deleteObjectStore('photos');
      db.createObjectStore('photos');
    };
    req.onsuccess=e=>{photoDB=e.target.result;res(photoDB)};
    req.onerror=e=>rej(e);
  });
}
function savePhoto(id,dataUrl){
  return openPhotoDB().then(db=>{
    return new Promise((res,rej)=>{
      const tx=db.transaction('photos','readwrite');
      tx.objectStore('photos').put(dataUrl,id);
      tx.oncomplete=()=>res();
      tx.onerror=e=>rej(e);
    });
  });
}
function loadPhoto(id){
  return openPhotoDB().then(db=>{
    return new Promise((res,rej)=>{
      const tx=db.transaction('photos','readonly');
      const req=tx.objectStore('photos').get(id);
      req.onsuccess=e=>res(e.target.result||null);
      req.onerror=e=>rej(e);
    });
  });
}
function loadAllPhotos(){
  return openPhotoDB().then(db=>{
    return new Promise((res,rej)=>{
      const tx=db.transaction('photos','readonly');
      const store=tx.objectStore('photos');
      const map={};
      const req=store.openCursor();
      req.onsuccess=e=>{
        const cursor=e.target.result;
        if(cursor){map[cursor.key]=cursor.value;cursor.continue();}
        else res(map);
      };
      req.onerror=e=>rej(e);
    });
  });
}

function loadData(){
  ['rodriguez_sel_v1','rodriguez_sel_v2','rodriguez_sel_v3','rodriguez_sel_v4','rodriguez_sel_v5','rodriguez_sel_v6','rodriguez_sel_v7','rodriguez_sel_v8','rodriguez_sel_v9','rodriguez_sel_v7_chunks','rodriguez_sel_v8_chunks','rodriguez_sel_v9_chunks'].forEach(k=>localStorage.removeItem(k));
  // Purge stale chunked caches from prior versions (v7–v9) so the old Thermador list can't resurface
  ['rodriguez_sel_v7','rodriguez_sel_v8','rodriguez_sel_v9'].forEach(v=>{for(let i=0;i<40;i++){localStorage.removeItem(v+'_c'+i);}});
  // Try single key first
  let raw=localStorage.getItem(SEL_KEY);
  // Try chunked storage if single key missing
  if(!raw){
    const chunks=localStorage.getItem(SEL_KEY+'_chunks');
    if(chunks){
      const total=parseInt(chunks,10);
      let assembled='';
      for(let i=0;i<total;i++){assembled+=(localStorage.getItem(SEL_KEY+'_c'+i)||'');}
      if(assembled)raw=assembled;
    }
  }
  if(raw){try{const d=JSON.parse(raw);if(Array.isArray(d)&&d.length>0){DATA=d;normalizeAllUrls();return;}}catch(e){}}
  DATA=JSON.parse(JSON.stringify(SEED_ROOMS));
  try{
    const old=localStorage.getItem('rodriguez_sel_v8');
    if(old){
      const oldData=JSON.parse(old);
      for(const oldRoom of oldData){
        const newRoom=DATA.find(r=>r.id===oldRoom.id);
        if(!newRoom)continue;
        for(const of_ of oldRoom.finishes||[]){
          const nf=newRoom.finishes.find(f=>f.type===of_.type&&f.material===of_.material);
          if(nf){nf.status=of_.status||nf.status;nf.notes=of_.notes||nf.notes;nf.model=of_.model||nf.model;nf.color=of_.color||nf.color;nf.leadTime=of_.leadTime||nf.leadTime;nf.link=cleanUrl(of_.link||nf.link||'');}
        }
        for(const oi of oldRoom.items||[]){
          const ni=newRoom.items.find(i=>i.name===oi.name);
          if(ni){if(oi.status)ni.status=oi.status;if(oi.notes!==undefined)ni.notes=oi.notes;if(oi.model!==undefined)ni.model=oi.model;if(oi.color!==undefined)ni.color=oi.color;if(oi.leadTime!==undefined)ni.leadTime=oi.leadTime;if(oi.link!==undefined)ni.link=cleanUrl(oi.link);if(oi.manual!==undefined)ni.manual=cleanUrl(oi.manual);}
        }
      }
    }
  }catch(e){}
  normalizeAllUrls();
  saveData();
}
function migrateRoomFields(){
  for(const r of DATA){
    if(!Array.isArray(r.finishes))r.finishes=[];
    if(!Array.isArray(r.items))r.items=[];
    if(!('lightingType' in r))r.lightingType='';
    if(!('lightingNotes' in r))r.lightingNotes='';
    if(!('lightingStatus' in r))r.lightingStatus='not_started';
    if(!('lightingPhoto' in r))r.lightingPhoto='';
  }
}
function _saveLocalOnly(){
  const clean=DATA.map(r=>{const {lightingPhoto,...rr}=r;return {...rr,finishes:r.finishes.map(f=>{const {photo,...rest}=f;return rest;}),items:r.items.map(i=>{const {photo,...rest}=i;return rest;})};});
  const payload=JSON.stringify(clean);
  try{localStorage.setItem(SEL_KEY,payload);}catch(e){}
}
function saveData(){
  // Strip photos from DATA before saving to localStorage
  const clean=DATA.map(r=>{const {lightingPhoto,...rr}=r;return {...rr,finishes:r.finishes.map(f=>{const {photo,...rest}=f;return rest;}),items:r.items.map(i=>{const {photo,...rest}=i;return rest;})};});
  const payload=JSON.stringify(clean);
  // Clear old chunk keys first
  for(let i=0;i<20;i++){const k=SEL_KEY+'_c'+i;if(localStorage.getItem(k)!==null)localStorage.removeItem(k);else break;}
  try{
    localStorage.setItem(SEL_KEY,payload);
    localStorage.removeItem(SEL_KEY+'_chunks');
  }catch(e){
    // Quota exceeded — chunk it into 512KB pieces
    localStorage.removeItem(SEL_KEY);
    const CHUNK=512*1024;
    const total=Math.ceil(payload.length/CHUNK);
    try{
      for(let i=0;i<total;i++){
        localStorage.setItem(SEL_KEY+'_c'+i,payload.slice(i*CHUNK,(i+1)*CHUNK));
      }
      localStorage.setItem(SEL_KEY+'_chunks',String(total));
    }catch(e2){
      showToast('⚠ Storage full — data NOT saved. Clear browser storage.',true);
      console.error('localStorage full:',e2);
    }
  }
  pushToSheets();
}

function buildByTrade(){
  const byTrade={};
  for(const r of DATA){
    if(!r)continue;
    for(const f of r.finishes||[]){
      const trade=TRADE_BY_TYPE[f.type]||'Other';
      if(!byTrade[trade])byTrade[trade]=[];
      byTrade[trade].push({room:r.name,level:r.level,item:f,isFinish:true});
    }
    for(const i of r.items||[]){
      const trade=suggestTradeForItem(i);
      if(!byTrade[trade])byTrade[trade]=[];
      byTrade[trade].push({room:r.name,level:r.level,item:i,isFinish:false});
    }
  }
  return byTrade;
}
function populateTradeTabs(byTrade){
  const tabEl=document.getElementById('tradeTabs');
  if(!tabEl)return;
  let tabHtml='<button type="button" class="trade-tab '+(curTradeTab==='all'?'active':'')+'" onclick="setTradeTab(\'all\',this)">All</button>';

    const n=(byTrade[trade]||[]).length;

    tabHtml+=`<button type="button" class="trade-tab ${curTradeTab===trade?'active':''}" data-trade="${escAttr(trade)}" onclick="setTradeTab(this.dataset.trade,this)">${esc(trade)} (${n})</button>`;
  }
  tabEl.innerHTML=tabHtml;
}

const TRADE_ORDER=['Flooring & Tile','Paint & Drywall','Trim & Millwork','Doors','Hardware','Countertops','Plumbing','Electrical','Lighting','Appliances','HVAC','Fixtures & Equipment','Other'];
let curTradeTab='all';
function setTradeTab(tab,btn){
  curTradeTab=tab;
  document.querySelectorAll('.trade-tab').forEach(b=>{b.classList.toggle('active',b===btn);});
  render();
}
function parseQtyForAgg(s, isItem, item){
  if(isItem){
    const name=String(item&&item.name||'');const xm=name.match(/\(x\s*(\d+)\)/i);return xm?parseInt(xm[1],10):1;
  }
  const v=String(s||'').trim();if(!v||v==='—')return 1;
  const m=v.replace(/,/g,'').match(/(\d+(?:\.\d+)?)/);
  return m?parseFloat(m[1]):1;
}
function buildPurchaseListByTrade(){
  const byTrade=buildByTrade();
  const aggregated={};
  for(const trade of TRADE_ORDER){
    let rows=byTrade[trade];if(!rows||!rows.length)continue;
    if(currentTypeFilter!=='all')rows=rows.filter(r=>matchesTypeFilter(r.isFinish?r.item:null,r.isFinish?null:r.item,currentTypeFilter));
    if(!rows.length)continue;
    const map={};
    for(const row of rows){
      const material=row.isFinish?row.item.material:(row.item.name||'');
      const vendor=(row.isFinish?row.item.vendor:row.item.vendor)||'TBD';
      const type=row.isFinish?row.item.type:'Item';
      const unit=row.isFinish?(row.item.unit||''):'EA';
      const key=`${material}|${vendor}|${type}`;
      if(!map[key]){
        map[key]={material,vendor,type,unit,isFinish:row.isFinish,totalQty:0,rooms:[]};
      }
      const entry=map[key];
      entry.totalQty+=parseQtyForAgg(row.isFinish?row.item.qty:null, !row.isFinish, row.isFinish?null:row.item);
      if(entry.rooms.indexOf(row.room)===-1)entry.rooms.push(row.room);
    }
    aggregated[trade]=Object.values(map);
  }
  return aggregated;
}
function renderByTrade(){
  const byTrade=buildByTrade();
  const agg=buildPurchaseListByTrade();
  populateTradeTabs(byTrade);
  const el=document.getElementById('body');let html='';
  html+=`<p style="font-size:11px;color:var(--dim);margin-bottom:12px">Combined by item — quantities summed across rooms</p>`;
  const tradesToShow=curTradeTab==='all'?TRADE_ORDER:[curTradeTab];
  for(const trade of tradesToShow){
    const rows=agg[trade];if(!rows||!rows.length)continue;
    html+=`<div class="mto-section"><div class="mto-cat-hdr open" onclick="toggleMTO(this)"><h4>${esc(trade)} <span style="color:var(--dim);font-weight:400;font-size:11px">(${rows.length})</span></h4><span class="arrow">▶</span></div><div class="mto-body open"><table class="mto-table"><thead><tr><th width="200">Rooms</th><th width="90">Type</th><th>Material / Item</th><th width="100">Qty / SF</th><th width="120">Vendor</th></tr></thead><tbody>`;
    for(const r of rows){
      const typeCell=r.isFinish?`<span class="finish-type ${FIN_TYPES[r.type]||'ft-other'}">${esc(r.type)}</span>`:`<span style="font-size:10px;color:var(--txt2)">Item</span>`;
      const roomsStr=r.rooms.length>3?r.rooms.slice(0,3).join(', ')+' +'+(r.rooms.length-3)+' more':r.rooms.join(', ');
      const qtyDisplay=r.unit?r.totalQty+' '+r.unit:String(r.totalQty);
      html+=`<tr><td style="font-size:11px;color:var(--txt2)">${esc(roomsStr)}</td><td>${typeCell}</td><td><strong>${esc(r.material)}</strong></td><td style="font-size:11px">${esc(qtyDisplay)}</td><td style="font-size:11px;color:var(--txt2)">${esc(r.vendor)}</td></tr>`;
    }
    html+=`</tbody></table></div></div>`;
  }
  el.innerHTML=html;
}

function exportByTrade(tradeFilter){
  let csv='Trade,Room,Level,Type,Material/Item,Qty,Unit\n';
  for(const r of DATA){
    if(!r)continue;
    for(const f of r.finishes||[]){
      const trade=TRADE_BY_TYPE[f.type]||'Other';
      if(tradeFilter&&trade!==tradeFilter)continue;
      csv+=`"${trade}","${(r.name||'').replace(/"/g,'""')}","${(r.level||'').replace(/"/g,'""')}","${(f.type||'').replace(/"/g,'""')}","${(f.material||'').replace(/"/g,'""')}","${(f.qty||'').replace(/"/g,'""')}","${(f.unit||'').replace(/"/g,'""')}"\n`;
    }
    for(const i of r.items||[]){
      const trade=suggestTradeForItem(i);
      if(tradeFilter&&trade!==tradeFilter)continue;
      csv+=`"${trade}","${(r.name||'').replace(/"/g,'""')}","${(r.level||'').replace(/"/g,'""')}","Item","${(i.name||'').replace(/"/g,'""')}","${(i.model||'').replace(/"/g,'""')}",""\n`;
    }
  }
  const fn=tradeFilter?'rodriguez_'+tradeFilter.replace(/\s+/g,'_').toLowerCase()+'.csv':'rodriguez_sub_schedule.csv';
  const a=document.createElement('a');a.href='data:text/csv;charset=utf-8,'+encodeURIComponent(csv);a.download=fn;document.body.appendChild(a);a.click();document.body.removeChild(a);showToast('✓ Exported');
}
function exportPurchaseList(tradeFilter){
  const agg=buildPurchaseListByTrade();
  let csv='Trade,Rooms,Type,Material/Item,Qty/SF,Vendor\n';
  const tradesToShow=tradeFilter?[tradeFilter]:TRADE_ORDER;
  for(const trade of tradesToShow){
    const rows=agg[trade];if(!rows||!rows.length)continue;
    for(const r of rows){
      const roomsStr=r.rooms.join('; ');
      const qtyDisplay=r.unit?r.totalQty+' '+r.unit:String(r.totalQty);
      csv+=`"${trade}","${(roomsStr||'').replace(/"/g,'""')}","${(r.type||'').replace(/"/g,'""')}","${(r.material||'').replace(/"/g,'""')}","${(qtyDisplay||'').replace(/"/g,'""')}","${(r.vendor||'').replace(/"/g,'""')}"\n`;
    }
  }
  const fn=tradeFilter?'rodriguez_purchase_'+tradeFilter.replace(/\s+/g,'_').toLowerCase()+'.csv':'rodriguez_purchase_list.csv';
  const a=document.createElement('a');a.href='data:text/csv;charset=utf-8,'+encodeURIComponent(csv);a.download=fn;document.body.appendChild(a);a.click();document.body.removeChild(a);showToast('✓ Exported');
}
function doExport(){
  if(curView==='trade')exportPurchaseList(curTradeTab==='all'?null:curTradeTab);
  else if(curView==='mto')exportByTrade(curTradeTab==='all'?null:curTradeTab);
  else exportSelections();
}

function updateAnyStatus(id,sel){
  sel.className='st-'+sel.value;
  for(const r of DATA){
    const f=r.finishes.find(x=>x.id===id);if(f){f.status=sel.value;saveData();showToast('✓ Saved');return;}
    const i=r.items.find(x=>x.id===id);if(i){i.status=sel.value;saveData();showToast('✓ Saved');return;}
  }
}
function updateAutoInterface(roomId,val){const r=findRoom(roomId);if(!r)return;r.automationInterface=val;saveData();render();showToast('✓ Saved');}

function autoFillFinish(roomId, fid, type, material){
  const src=getFinishByMaterial(type, material);
  if(!src)return;
  const r=findRoom(roomId);if(!r)return;
  const f=r.finishes.find(x=>x.id===fid);if(!f)return;
  let changed=false;
  if(src.link&&!f.link){f.link=cleanUrl(src.link);changed=true;}
  if(src.photo&&!f.photo){f.photo=src.photo;changed=true;}

const SELECTIONS_URL='https://ove-selections.racinc19.workers.dev/selections';
const SEL_WRITE_TOKEN='e2b7c83eb4d76edee16503108fb0377482cefc0c'; // matches the worker's WRITE_TOKEN secret (blocks drive-by writes; note: visible in page source)
async function remoteLoad(){
  try{
    const r=await fetch(SELECTIONS_URL+'?_='+Date.now(),{cache:'no-store'});
    if(!r.ok)return null;
    const j=await r.json();
    return (j&&Array.isArray(j.data))?j.data:null;
  }catch(e){console.warn('remoteLoad failed:',e&&e.message);return null;}
}
async function remoteSave(data){
  const headers={'Content-Type':'application/json'};
  if(SEL_WRITE_TOKEN)headers['X-OVE-Token']=SEL_WRITE_TOKEN;
  const r=await fetch(SELECTIONS_URL,{method:'PUT',headers,body:JSON.stringify(data)});
  if(!r.ok)throw new Error('remoteSave '+r.status);
  return r.json().catch(()=>({}));
}

async function fallbackLoad(){
  try{
    const r=await fetch('selections-fallback.json?_='+Date.now(),{cache:'no-store'});
    if(!r.ok)return null;
    const d=await r.json();
    const rooms=Array.isArray(d)?d:(d&&Array.isArray(d.rooms)?d.rooms:(d&&Array.isArray(d.data)?d.data:null));
    return rooms&&rooms.length?rooms:null;
  }catch(e){
    console.warn('Selection fallback load failed:',e.message);
    return null;
  }
}

function hasSelectionStatus(data){
  return Array.isArray(data)&&data.some(r=>
    [...(r.finishes||[]),...(r.items||[])].some(x=>x.status&&x.status!=='not_started')
  );
}

async function init(){
  _blockSync=true;
  // Source of truth order: shared store (Section 3) → local cache (busted to approved) → SEED.
  let loadedFromRemote=false;

      DATA=d;

    }

  }
  if(!loadedFromRemote){
    loadData();
    _usingSelectionFallback=true;
  }
  if(!loadedFromRemote&&!hasSelectionStatus(DATA)){
    const fallback=await fallbackLoad();

    }
  }catch(e){}

function sortedStringify(obj){
  if(obj===null)return 'null';
  if(Array.isArray(obj))return '['+obj.map(sortedStringify).join(',')+']';
  if(typeof obj==='object')return '{'+Object.keys(obj).sort().map(k=>'"'+k+'":'+sortedStringify(obj[k])).join(',')+'}';
  return JSON.stringify(obj);
}
function isSeedData(clean){return clean.length===SEED_ROOMS.length&&sortedStringify(clean)===sortedStringify(SEED_ROOMS);}

        {id:'f'+Math.random().toString(36).slice(2,9),type:'Door',material:'Security Door per Quote',qty:'1',unit:'EA',vendor:'TBD',link:'',notes:'Per client door schedule (Panic Room).',status:'not_started',model:'',color:'',leadTime:'',photo:''},
        {id:'f'+Math.random().toString(36).slice(2,9),type:'Wall',material:'TBD',qty:'',unit:'',vendor:'TBD',link:'',notes:'',status:'not_started',model:'',color:'',leadTime:'',photo:''},
        {id:'f'+Math.random().toString(36).slice(2,9),type:'Ceiling',material:'TBD',qty:'',unit:'',vendor:'TBD',link:'',notes:'',status:'not_started',model:'',color:'',leadTime:'',photo:''}
      ],items:[]};
    if(_grIdx!==-1)DATA.splice(_grIdx+1,0,_pr);else DATA.push(_pr);
    dirty=true;
  }
  // Add Office Closet if missing
  if(!DATA.find(r=>r.id==='office_closet')){
    const _obi=DATA.findIndex(r=>r.id==='office_bath');
    const _oc={level:'Main Level',id:'office_closet',name:'Office Closet',automationInterface:'',lightingType:'',lightingPhoto:'',
      finishes:[{id:'f'+Math.random().toString(36).slice(2,9),type:'Floor',material:'TBD',qty:'',unit:'SF',vendor:'TBD',link:'',notes:'',status:'not_started',model:'',color:'',leadTime:'',photo:''},
               {id:'f'+Math.random().toString(36).slice(2,9),type:'Door',material:'TruStile TMF1000 MDF - Flush x5',qty:'1',unit:'EA',vendor:'TruStile / Sunpro',link:'https://www.trustile.com/interior-doors/tmf-series/tmf1000',notes:'Per client door schedule (Office Closet).',status:'not_started',model:'TMF1000',color:'Off-White, ORB hinges',leadTime:'7-8 wks',photo:''}],items:[]};
    if(_obi!==-1)DATA.splice(_obi,0,_oc);else DATA.push(_oc);
    dirty=true;
  }
  // (Removed 2026-07-17) Old "Split Thermador combined item" migration — it re-injected the
  // retired Thermador fridge/freezer columns from stale cache. Approved package is Sub-Zero (SEED).
  // Add Display/Sound to rooms that should have them - never remove from anywhere
  const _keepDS=new Set(['outdoor_bbq','office','great_room','primary_suite','primary_bath','adu_bedroom','basement_living']);
  for(const r of DATA){
    if(_keepDS.has(r.id)){
      if(!r.items.find(it=>it.name==='Display')){r.items.push({id:'i'+Math.random().toString(36).slice(2,9),name:'Display',vendor:'TBD',link:'',manual:'',notes:'',status:'not_started',model:'',color:'',leadTime:'',photo:''});dirty=true;}
      if(!r.items.find(it=>it.name==='Sound')){r.items.push({id:'i'+Math.random().toString(36).slice(2,9),name:'Sound',vendor:'TBD',link:'',manual:'',notes:'',status:'not_started',model:'',color:'',leadTime:'',photo:''});dirty=true;}
    }
  }
  // Add Door to Basement Living if missing
  const _bl=DATA.find(r=>r.id==='basement_living');
  if(_bl&&!_bl.finishes.find(f=>f.type==='Door')){
    const _floorIdx=_bl.finishes.findIndex(f=>f.type==='Floor');
    _bl.finishes.splice(_floorIdx>=0?_floorIdx+1:1,0,{id:'f'+Math.random().toString(36).slice(2,9),type:'Door',material:'Security Door per Quote',qty:'1',unit:'EA',vendor:'TBD',link:'',notes:'Per client door schedule (Basement Living / Theater).',status:'not_started',model:'',color:'',leadTime:'',photo:''});
    dirty=true;
  }
  // Add Door to Gun Room if missing
  const _gun=DATA.find(r=>r.id==='gun_range');
  if(_gun&&!_gun.finishes.find(f=>f.type==='Door')){
    _gun.finishes.splice(1,0,{id:'f'+Math.random().toString(36).slice(2,9),type:'Door',material:'Hollow Metal',qty:'1',unit:'EA',vendor:'TBD',link:'',notes:'Per client door schedule (Gun Range). See items for vault door.',status:'not_started',model:'',color:'',leadTime:'',photo:''});
    dirty=true;
  }
  // Remove Door from Great Room, Dining Room (neither has a door per plans)
  for(const rid of ['great_room','dining']){
    const _r=DATA.find(r=>r.id===rid);
    if(_r){
      const idx=_r.finishes.findIndex(f=>f.type==='Door');
      if(idx>=0){_r.finishes.splice(idx,1);dirty=true;}
    }
  }
  // Backfill blank Door finish fields from SEED (handles existing localStorage records with empty material)
  const _seedMap=new Map(SEED_ROOMS.map(r=>[r.id,r]));
  for(const room of DATA){
    const _seed=_seedMap.get(room.id);
    if(!_seed)continue;
    for(const f of room.finishes){
      if(f.type!=='Door')continue;
      if(f.material&&f.material.trim())continue; // already has content
      const _sf=_seed.finishes.find(sf=>sf.type==='Door');
      if(!_sf)continue;
      f.material=_sf.material||f.material;
      f.model=f.model||_sf.model||'';
      f.color=f.color||_sf.color||'';
      f.notes=f.notes||_sf.notes||'';
      f.link=cleanUrl(f.link||_sf.link||'');
      f.vendor=f.vendor||_sf.vendor||'';
      f.leadTime=f.leadTime||_sf.leadTime||'';
      dirty=true;
    }
  }
  normalizeAllUrls();
  if(dirty)saveData();
}

init();

function copyFinishToRooms(roomId, finishId){
  const srcRoom=DATA.find(r=>r.id===roomId);
  if(!srcRoom)return;
  const srcFinish=srcRoom.finishes.find(f=>f.id===finishId);
  if(!srcFinish)return;
  const type=srcFinish.type;
  const fields=['material','qty','vendor','link','notes','model','color','leadTime'];
  let count=0;
  for(const r of DATA){
    if(r.id===roomId)continue;
    const target=r.finishes.find(f=>f.type===type);
    if(target){
      fields.forEach(k=>{
        if(!srcFinish[k])return;
        if(k==='link')target.link=cleanUrl(srcFinish.link);
        else target[k]=srcFinish[k];
      });
      count++;
    }
  }
  saveData();render();
  showToast(`Copied ${type} to ${count} room${count!==1?'s':''}`);
}
</script>

    <input class="pin-input" id="pinInput" type="password" maxlength="10" placeholder="••••" onkeydown="if(event.key==='Enter')submitPin()">
    <div class="pin-error" id="pinError"></div>
    <div style="display:flex;gap:8px;justify-content:center">
      <button class="btn btn-dim btn-sm" onclick="closeModal('modalPin')">Cancel</button>
      <button class="btn btn-blue btn-sm" onclick="submitPin()">Approve</button>
    </div>
  </div>
</div>
