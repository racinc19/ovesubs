<!DOCTYPE html>
<html lang="en">
<head>

<title>OVE subs - Subcontractor Contacts</title>
<style>
:root{--bg:#0c1220;--card:#141e30;--card2:#1a2640;--hover:#1e2d4a;--bdr:#2a3a55;--txt:#e5e7eb;--txt2:#94a3b8;--dim:#64748b;--blue:#3b82f6;--green:#22c55e;--yellow:#eab308;--orange:#f59e0b;--red:#ef4444;--cyan:#06b6d4;--purple:#8b5cf6}
*{margin:0;padding:0;box-sizing:border-box}
html{overflow-y:scroll}
body{padding-top:56px;font-family:'SF Pro Display',-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif;background:var(--bg);color:var(--txt);min-height:100vh;line-height:1.5;overflow-x:hidden}
.topnav{position:fixed;top:0;left:0;width:100vw;z-index:100;background:var(--card);border-bottom:1px solid var(--bdr);padding:0 20px}
.topnav-inner{max-width:1600px;margin:0 auto;display:flex;align-items:center;gap:8px;min-height:56px;flex-wrap:wrap;padding:8px 0}
.topnav-brand{display:flex;align-items:center;gap:10px;text-decoration:none;color:#fff;font-weight:700;font-size:15px;white-space:nowrap;margin-right:8px}
.topnav-brand .dot{width:8px;height:8px;border-radius:50%;background:var(--green);animation:pulse 2s infinite}
@keyframes pulse{0%,100%{opacity:1}50%{opacity:.4}}
.topnav-links{display:flex;gap:4px;align-items:center;flex-wrap:wrap;flex:1}
.topnav-links a{padding:6px 12px;border-radius:8px;font-size:12px;font-weight:600;color:var(--txt2);text-decoration:none;transition:all .2s;white-space:nowrap}
.topnav-links a:hover{color:var(--txt);background:var(--hover)}
.topnav-links a.active{color:white;background:var(--cyan)}
.container{max-width:1320px;margin:0 auto;padding:22px 20px 44px}
.hero{display:flex;align-items:center;justify-content:space-between;gap:16px;flex-wrap:wrap;background:var(--card);border:1px solid var(--bdr);border-radius:8px;padding:20px 22px;margin-bottom:18px}
.eyebrow{font-size:11px;font-weight:800;text-transform:uppercase;letter-spacing:.08em;color:var(--cyan);margin-bottom:4px}
h1{font-size:26px;line-height:1.15;margin-bottom:4px}
.sub{font-size:13px;color:var(--txt2)}
.tools{display:flex;gap:10px;align-items:center;flex-wrap:wrap}
.search{width:min(420px,100%);background:var(--card2);border:1px solid var(--bdr);border-radius:8px;color:var(--txt);font-size:14px;padding:10px 12px;outline:none}
.search:focus{border-color:var(--cyan)}
.count{font-size:12px;color:var(--txt2);border:1px solid var(--bdr);border-radius:999px;padding:7px 12px;background:rgba(6,182,212,.08)}
.sheet{background:var(--card);border:1px solid var(--bdr);border-radius:8px;overflow:hidden}
table{width:100%;border-collapse:collapse}
th,td{text-align:left;vertical-align:top;border-bottom:1px solid rgba(42,58,85,.75);padding:12px 14px;font-size:13px}
th{position:sticky;top:56px;z-index:5;background:#10182a;color:var(--txt2);font-size:11px;font-weight:800;text-transform:uppercase;letter-spacing:.06em}
tr:hover td{background:rgba(30,45,74,.55)}
.vendor{font-weight:800;color:#fff}
.trade{color:var(--txt2)}
.muted{color:var(--dim)}
.link{color:var(--cyan);text-decoration:none;font-weight:700;display:block;margin-bottom:4px;word-break:break-word}
.link:hover{text-decoration:underline}
.empty{padding:22px;color:var(--dim);font-size:13px}
@media(max-width:820px){body{padding-top:104px}.topnav-inner{align-items:flex-start}.hero{align-items:flex-start}th{top:104px}.sheet{overflow-x:auto}table{min-width:760px}}
</style>
</head>
<body>
<nav class="topnav"><div class="topnav-inner">
  <a href="index.html" class="topnav-brand"><span class="dot"></span>OVE subs</a>
  <div class="topnav-links">
    <a href="index.html">Dashboard</a>
    <a href="subs.html" style="color:var(--orange);border:1px solid rgba(245,158,11,.3)">Subs List</a>
    <a href="contacts.html" class="active">Subcontractor Contacts</a>
    <a href="https://drive.google.com/drive/u/0/folders/1kS-2awScLDAnGS973xD0D28RxynI49Si" target="_blank" rel="noopener noreferrer">Plans &amp; Permits</a>
    <a href="selections.html" style="color:var(--purple);border:1px solid rgba(139,92,246,.3)">Selections</a>
    <a href="superintendents.html" style="color:var(--green);border:1px solid rgba(34,197,94,.3)">Superintendent Notes</a>
    <a href="electrical.html">Electrical</a>
    <a href="plumbing.html">Plumbing</a>
  </div>
</div></nav>

<main class="container">
  <section class="hero">
    <div>
      <div class="eyebrow">Tap sheet</div>
      <h1>Subcontractor Contacts</h1>
      <div class="sub">Phone and email list for Oak Valley Estates Lot 5 subcontractors.</div>
    </div>
    <div class="tools">
      <input class="search" id="search" placeholder="Search name, trade, phone, or email" oninput="render()">
      <div class="count" id="count">Loading...</div>
    </div>
  </section>

  <section class="sheet" id="sheet">
    <div class="empty">Loading subcontractor contacts...</div>
  </section>
</main>

<script src="shared.js?v20260805_co_docs"></script>
<script>
let rows=[];
const alias={
  'a&l finish carpentry':'a&l',
  'bateman - cherotech / t builds':'cherotech',
  'blackstonex llc':'blackstone',
  'blackstone':'blackstone',
  'blvd':'blvd',
  'noble house electric':'noble house electric',
  'creative engineering':'creative engineering',
  'd-iron works':'d-iron works',
  'd4':'d4',
  'h & e drywall':'h&e',
  "kuhn's heating and air":"kuhn's",
  'lp - d2 building solutions':'lp',
  'master':'master',
  'peppermint cabinets':'peppermint',
  'peppermint':'peppermint',
  'rg ventures':'rg ventures',
  'randy frei construction':'frie',
  'stg - st george windows & doors':'stg',
  'sunpro':'sunpro',
  'sunroc':'sunroc',
  'the countertop source':'countertop source'
};
const vendorOverride={
  'alysa oliver':'Amy Pendleton',
  'allysa oliver':'Amy Pendleton',
  'recelectric':'Noble House Electric',
  'breck':'Noble House Electric',
  'breck electric':'Noble House Electric',
  'breck electric inc':'Noble House Electric',
  'breck electric inc.':'Noble House Electric'
};
const removedVendors=new Set(['deez','deezcabnuts','these cabinets']);
function norm(s){return String(s||'').toLowerCase().replace(/[^a-z0-9&]+/g,' ').trim()}
function esc(s){return String(s||'').replace(/[&<>"']/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[m]))}
function firstFilled(...vals){return vals.find(v=>String(v||'').trim())||''}
function findInfo(vendor,info){
  const key=norm(vendor);
  if(info[key])return info[key];
  if(alias[key]&&info[alias[key]])return info[alias[key]];
  return Object.values(info).find(item=>{
    const sheet=norm(item.sheet_vendor);
    const company=norm(item.company);
    return sheet&&key.includes(sheet)||sheet&&sheet.includes(key)||company&&key.includes(company)||company&&company.includes(key);
  })||{};
}
function contactLinks(items,type){
  const vals=(items||[]).filter(Boolean);
  if(!vals.length)return '<span class="muted">Not listed</span>';
  return vals.map(v=>{
    const href=type==='phone'?'tel:'+String(v).replace(/[^0-9+]/g,''):'mailto:'+v;
    return `<a class="link" href="${href}">${esc(v)}</a>`;
  }).join('');
}
function buildRows(tasks,info){
  const vendors={};
  tasks.forEach(t=>{
    if(!t.vendor||t.isPhase)return;
    const rawVendor=t.vendor.trim();
    const vendor=vendorOverride[norm(rawVendor)]||rawVendor;
    if(removedVendors.has(norm(vendor)))return;
    if(!vendors[vendor])vendors[vendor]={vendor,trades:[]};
    if(t.name&&!vendors[vendor].trades.includes(t.name))vendors[vendor].trades.push(t.name);
  });
  Object.values(info).forEach(item=>{
    const vendor=firstFilled(item.sheet_vendor,item.company);
    if(removedVendors.has(norm(vendor)))return;
    if(vendor&&!vendors[vendor])vendors[vendor]={vendor,trades:[]};
  });
  if(!vendors['RG Ventures'])vendors['RG Ventures']={vendor:'RG Ventures',trades:['Concrete']};
  return Object.values(vendors).map(v=>{
    const item=findInfo(v.vendor,info);
    return {
      vendor:v.vendor,
      company:firstFilled(item.company,v.vendor),
      contact:item.contact||'',
      trades:v.trades.join(', '),
      phones:item.phones||[],
      emails:item.emails||[]
    };
  }).sort((a,b)=>a.vendor.localeCompare(b.vendor));
}
function render(){
  const q=norm(document.getElementById('search').value);
  const filtered=rows.filter(r=>!q||norm([r.vendor,r.company,r.contact,r.trades,(r.phones||[]).join(' '),(r.emails||[]).join(' ')].join(' ')).includes(q));
  document.getElementById('count').textContent=`${filtered.length} contact${filtered.length===1?'':'s'}`;
  if(!filtered.length){
    document.getElementById('sheet').innerHTML='<div class="empty">No matching subcontractors.</div>';
    return;
  }
  document.getElementById('sheet').innerHTML=`<table><thead><tr><th>Subcontractor</th><th>Trade</th><th>Contact</th><th>Phone</th><th>Email</th></tr></thead><tbody>${filtered.map(r=>`<tr><td><div class="vendor">${esc(r.vendor)}</div><div class="muted">${esc(r.company)}</div></td><td class="trade">${esc(r.trades||'Not listed')}</td><td>${r.contact?esc(r.contact):'<span class="muted">Not listed</span>'}</td><td>${contactLinks(r.phones,'phone')}</td><td>${contactLinks(r.emails,'email')}</td></tr>`).join('')}</tbody></table>`;
}
async function init(){
  try{
    const [project,info]=await Promise.all([loadProjectData(),fetch('sub_info.json?v20260810_contacts').then(r=>r.json())]);
    rows=buildRows(project.main.scheduleTasks||[],info||{});
    render();
  }catch(e){
    document.getElementById('sheet').innerHTML=`<div class="empty">Could not load contacts: ${esc(e.message)}</div>`;
    document.getElementById('count').textContent='Needs refresh';
  }
}
init();
</script>
</body>
</html>
