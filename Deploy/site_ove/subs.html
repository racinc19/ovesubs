<!DOCTYPE html>
<html lang="en">
<head>
<meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate">
<meta http-equiv="Pragma" content="no-cache">
<meta http-equiv="Expires" content="0">
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Rodriguez Residence — Subcontractor Portal Access</title>
<style>
:root{--bg:#0c1220;--card:#141e30;--card2:#1a2640;--hover:#1e2d4a;--bdr:#2a3a55;--bdr2:#354766;--txt:#e8edf5;--txt2:#8899b0;--dim:#5a6d85;--blue:#3b82f6;--green:#22c55e;--yellow:#eab308;--red:#ef4444;--orange:#f59e0b;--cyan:#06b6d4;--purple:#8b5cf6}
*{margin:0;padding:0;box-sizing:border-box}
body{padding-top:56px;font-family:'SF Pro Display',-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif;background:var(--bg);color:var(--txt);min-height:100vh;line-height:1.5}
.container{max-width:1200px;margin:0 auto;padding:24px 20px}

#loading{display:flex;flex-direction:column;align-items:center;justify-content:center;min-height:80vh;gap:16px}
.spinner{width:48px;height:48px;border:4px solid var(--bdr);border-top-color:var(--blue);border-radius:50%;animation:spin .8s linear infinite}
@keyframes spin{to{transform:rotate(360deg)}}
#loading .msg{color:var(--txt2);font-size:14px}
#app{display:none}

/* Nav */
.topnav{position:fixed;top:0;left:0;width:100vw;z-index:50;background:var(--card);border-bottom:1px solid var(--bdr);padding:0 20px}
.topnav-inner{max-width:1600px;margin:0 auto;display:flex;align-items:center;justify-content:flex-start;height:56px;gap:8px;position:relative;min-width:0}
.topnav-brand{display:flex;align-items:center;gap:10px;text-decoration:none;color:#fff;font-weight:700;font-size:16px;white-space:nowrap;flex:0 0 auto}
.topnav-brand .dot{width:8px;height:8px;border-radius:50%;background:var(--green);animation:pulse 2s infinite}
@keyframes pulse{0%,100%{opacity:1}50%{opacity:.4}}
.topnav-links{flex:1 1 auto;min-width:0;display:flex;gap:4px;align-items:center;overflow-x:auto;-webkit-overflow-scrolling:touch;scrollbar-width:thin}
.topnav-links a{padding:8px 16px;border-radius:8px;font-size:13px;font-weight:600;color:var(--txt2);text-decoration:none;transition:all .2s;white-space:nowrap;flex-shrink:0}
.topnav-links a:hover{color:var(--txt);background:var(--hover)}
.topnav-right{flex:0 0 auto;display:flex;gap:8px;align-items:center}
.topnav-btn{padding:6px 14px;border-radius:8px;font-size:12px;font-weight:500;border:1px solid var(--bdr);background:none;color:var(--txt2);cursor:pointer;transition:all .2s;white-space:nowrap}
.topnav-btn:hover{border-color:var(--blue);color:var(--txt)}

/* Hero */
.hero{background:var(--card);border:1px solid var(--bdr);border-radius:16px;padding:28px 32px;margin-bottom:28px;display:flex;align-items:center;justify-content:space-between;flex-wrap:wrap;gap:16px}
.hero-title{font-size:22px;font-weight:700;margin-bottom:4px}
.hero-sub{font-size:14px;color:var(--txt2)}
.hero-badge{background:rgba(59,130,246,.12);border:1px solid rgba(59,130,246,.25);color:var(--blue);padding:6px 14px;border-radius:20px;font-size:12px;font-weight:700;text-transform:uppercase;letter-spacing:.5px}

/* Cards grid */
.cards-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(280px,1fr));gap:16px}

.sub-card{background:var(--card);border:1px solid var(--bdr);border-radius:14px;padding:20px;cursor:pointer;text-decoration:none;color:inherit;display:block;transition:all .2s;position:relative;overflow:hidden}
.sub-card:hover{border-color:var(--cyan);background:var(--hover);transform:translateY(-2px);box-shadow:0 8px 24px rgba(0,0,0,.3)}
.sub-card::before{content:'';position:absolute;top:0;left:0;right:0;height:3px;background:var(--bdr);border-radius:14px 14px 0 0;transition:background .2s}
.sub-card:hover::before{background:var(--cyan)}
.sub-card.done::before{background:var(--green)}
.sub-card.active::before{background:var(--orange)}
.sub-card.upcoming::before{background:var(--blue)}

.card-vendor{font-size:16px;font-weight:700;margin-bottom:4px;color:var(--txt)}
.card-trade{font-size:12px;color:var(--txt2);margin-bottom:14px}

.card-meta{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-bottom:14px}
.card-meta-item{display:flex;flex-direction:column;gap:2px}
.card-meta-label{font-size:10px;font-weight:700;text-transform:uppercase;letter-spacing:.5px;color:var(--dim)}
.card-meta-value{font-size:12px;color:var(--txt2)}

.card-progress{margin-bottom:10px}
.progress-header{display:flex;justify-content:space-between;align-items:center;margin-bottom:6px}
.progress-label{font-size:11px;color:var(--dim)}
.progress-pct{font-size:13px;font-weight:700}
.progress-pct.done{color:var(--green)}
.progress-pct.active{color:var(--orange)}
.progress-pct.upcoming{color:var(--blue)}
.progress-bar{height:6px;background:var(--bdr);border-radius:3px;overflow:hidden}
.progress-fill{height:100%;border-radius:3px;transition:width .3s}
.progress-fill.done{background:var(--green)}
.progress-fill.active{background:var(--orange)}
.progress-fill.upcoming{background:var(--blue)}

.card-cta{font-size:11px;color:var(--cyan);font-weight:600;text-align:right;margin-top:8px;opacity:0;transition:opacity .2s}
.sub-card:hover .card-cta{opacity:1}

.section-header{margin-bottom:16px}
.section-header h2{font-size:18px;font-weight:700}
.section-header p{font-size:13px;color:var(--txt2);margin-top:4px}

html{overflow-y:scroll}
</style>
</head>
<body>
<nav class="topnav"><div class="topnav-inner">
  <a href="index.html" class="topnav-brand"><span class="dot"></span>OVE subs</a>
  <div class="topnav-links">
    <a href="index.html">Dashboard</a>
    <a href="subs.html" style="padding:8px 14px;border-radius:8px;font-size:13px;font-weight:700;color:#fff;background:var(--orange);text-decoration:none">🔑 Portal Access</a>
    <a href="contacts.html" style="padding:8px 14px;border-radius:8px;font-size:13px;font-weight:600;color:var(--cyan);text-decoration:none;border:1px solid rgba(6,182,212,.3)">Subcontractor Contacts</a>
    <a href="https://drive.google.com/drive/u/0/folders/1kS-2awScLDAnGS973xD0D28RxynI49Si" target="_blank" style="padding:8px 14px;border-radius:8px;font-size:13px;font-weight:600;color:var(--cyan);text-decoration:none;border:1px solid rgba(6,182,212,.3)">📁 Plans & Permits</a>
    <a href="selections.html" style="padding:8px 14px;border-radius:8px;font-size:13px;font-weight:600;color:var(--purple);text-decoration:none;border:1px solid rgba(139,92,246,.3)">🎨 Selections</a>
    <a href="superintendents.html" style="padding:8px 14px;border-radius:8px;font-size:13px;font-weight:600;color:var(--green);text-decoration:none;border:1px solid rgba(34,197,94,.3)">📝 Superintendent Notes</a>
    <a href="electrical.html" style="padding:8px 14px;border-radius:8px;font-size:13px;font-weight:600;color:var(--yellow);text-decoration:none;border:1px solid rgba(234,179,8,.3)">⚡ Electrical</a>
    <a href="plumbing.html" style="padding:8px 14px;border-radius:8px;font-size:13px;font-weight:600;color:var(--cyan);text-decoration:none;border:1px solid rgba(6,182,212,.3)">🚰 Plumbing</a>
  </div>
  <div class="topnav-right">
    <button class="topnav-btn" onclick="doRefresh()">↻ Refresh</button>
  </div>
</div></nav>

<div id="loading"><div class="spinner"></div><div class="msg">Loading subcontractor portal…</div></div>

<div id="app" class="container">
  <div class="hero">
    <div>
      <div class="hero-title">Subcontractor Portal Access</div>
      <div class="hero-sub">Click your company name to access your portal</div>
    </div>
    <div class="hero-badge">Oak Valley Estates Lot 5</div>
  </div>

  <div class="section-header">
    <h2>Subcontractors</h2>
    <p id="subCount"></p>
  </div>

  <div class="cards-grid" id="cardsGrid"></div>
</div>

<script src="shared.js?v20260805_co_docs"></script>
<script>
function slugify(s){return encodeURIComponent(s.trim())}
function fmtD(d){if(!d)return'—';return(d.getMonth()+1)+'/'+d.getDate()+'/'+d.getFullYear()}

function statusClass(p,start){
  if(p>=100)return'done';
  if(p>0)return'active';
  if(start&&start<=new Date())return'active';
  return'upcoming';
}

function buildCards(tasks){
  // Group tasks by vendor — only tasks with a vendor assigned
  const vendorMap={};
  tasks.forEach(t=>{
    if(!t.vendor||t.isPhase)return;
    const v=t.vendor.trim();
    if(!vendorMap[v])vendorMap[v]={trades:[],tasks:[],vendor:v};
    vendorMap[v].tasks.push(t);
    if(t.name&&!vendorMap[v].trades.includes(t.name))vendorMap[v].trades.push(t.name);
  });

  const vendors=Object.values(vendorMap).sort((a,b)=>a.vendor.localeCompare(b.vendor));
  const grid=document.getElementById('cardsGrid');
  grid.innerHTML='';

  vendors.forEach(vd=>{
    const vTasks=vd.tasks;
    // Compute aggregate: avg progress, earliest start, latest finish
    const totalProg=vTasks.reduce((s,t)=>s+(parseFloat(t.progress)||0),0);
    const avgProg=vTasks.length?Math.round(totalProg/vTasks.length):0;
    const starts=vTasks.map(t=>t.startDate).filter(Boolean);
    const ends=vTasks.map(t=>t.endDate||t.startDate).filter(Boolean);
    const earliestStart=starts.length?new Date(Math.min(...starts.map(d=>d.getTime()))):null;
    const latestEnd=ends.length?new Date(Math.max(...ends.map(d=>d.getTime()))):null;
    const cls=statusClass(avgProg,earliestStart);
    const today=new Date();today.setHours(0,0,0,0);

    // Status label
    let statusTxt='Upcoming';
    if(avgProg>=100)statusTxt='Complete';
    else if(avgProg>0)statusTxt='In Progress';
    else if(earliestStart&&earliestStart<=today)statusTxt='Active';

    // Trade list (up to 3 shown)
    const tradeList=vd.trades.slice(0,3).join(', ')+(vd.trades.length>3?' +more':'');

    const card=document.createElement('a');
    card.href=`sub.html?v=${slugify(vd.vendor)}`;
    card.className=`sub-card ${cls}`;
    card.innerHTML=`
      <div class="card-vendor">${vd.vendor}</div>
      <div class="card-trade">${tradeList}</div>
      <div class="card-meta">
        <div class="card-meta-item">
          <span class="card-meta-label">Start</span>
          <span class="card-meta-value">${fmtD(earliestStart)}</span>
        </div>
        <div class="card-meta-item">
          <span class="card-meta-label">Finish</span>
          <span class="card-meta-value">${fmtD(latestEnd)}</span>
        </div>
        <div class="card-meta-item">
          <span class="card-meta-label">Tasks</span>
          <span class="card-meta-value">${vTasks.length}</span>
        </div>
        <div class="card-meta-item">
          <span class="card-meta-label">Status</span>
          <span class="card-meta-value">${statusTxt}</span>
        </div>
      </div>
      <div class="card-progress">
        <div class="progress-header">
          <span class="progress-label">Overall Progress</span>
          <span class="progress-pct ${cls}">${avgProg}%</span>
        </div>
        <div class="progress-bar"><div class="progress-fill ${cls}" style="width:${Math.min(avgProg,100)}%"></div></div>
      </div>
      <div class="card-cta">Click to access portal →</div>
    `;
    grid.appendChild(card);
  });

  document.getElementById('subCount').textContent=`${vendors.length} subcontractor${vendors.length===1?'':'s'} on this project`;
}

async function init(){
  try{
    const data=await loadProjectData();
    const tasks=data.main.scheduleTasks||[];
    buildCards(tasks);
    document.getElementById('loading').style.display='none';
    document.getElementById('app').style.display='block';
  }catch(e){
    console.error('subs portal error:',e);
    document.getElementById('loading').style.cssText='display:flex;flex-direction:column;align-items:center;justify-content:center;min-height:80vh;gap:16px';
    document.getElementById('loading').innerHTML=`<div style="background:rgba(239,68,68,.1);border:1px solid rgba(239,68,68,.3);border-radius:12px;padding:24px 32px;text-align:center;max-width:480px"><h3 style="color:var(--red);margin-bottom:8px">&#9888; Failed to load</h3><p style="font-size:13px;color:var(--txt2);margin-bottom:16px">${e.message}</p><button onclick="doRefresh()" style="padding:8px 20px;border-radius:8px;background:var(--blue);color:#fff;border:none;cursor:pointer;font-size:13px">Retry</button></div>`;
  }
}

function doRefresh(){location.reload()}
init();
</script>
</body>
</html>
